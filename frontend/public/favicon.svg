<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="shieldGrad" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <!-- Inner Dark Fill -->
    <linearGradient id="darkBg" x1="32" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181B22" />
      <stop offset="100%" stop-color="#0D0F14" />
    </linearGradient>
    <!-- Accent Line Gradient -->
    <linearGradient id="accentGrad" x1="18" y1="16" x2="46" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="0" y="0" width="64" height="64" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#3B82F6" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Outer Shield Glow & Border -->
  <path d="M32 6L54 14V28C54 42.4 44.6 54.4 32 58C19.4 54.4 10 42.4 10 28V14L32 6Z" 
        fill="url(#shieldGrad)" 
        filter="url(#glow)" />

  <!-- Inner Dark Shield Body -->
  <path d="M32 9.5L50.5 16.5V28C50.5 39.8 42.7 49.8 32 53.5C21.3 49.8 13.5 39.8 13.5 28V16.5L32 9.5Z" 
        fill="url(#darkBg)" />

  <!-- Inner Subtle Border -->
  <path d="M32 12.5L47.5 18.2V28C47.5 37.5 41 45.8 32 49.2C23 45.8 16.5 37.5 16.5 28V18.2L32 12.5Z" 
        stroke="url(#accentGrad)" 
        stroke-width="1.5" 
        stroke-opacity="0.35" 
        fill="none" />

  <!-- Central Shield Checkmark & Sentinel Node -->
  <path d="M24 31.5L29.5 37L40.5 24.5" 
        stroke="url(#accentGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />

  <!-- Top Security Sparkle Dot -->
  <circle cx="32" cy="18" r="2" fill="#60A5FA" />
</svg>